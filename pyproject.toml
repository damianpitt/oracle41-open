[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "oracle41-open"
version = "0.4.0a4"
description = "Linux-first local wallet analytics desktop app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Oracle41 Team" }
]
keywords = ["crypto", "wallet", "analytics", "evm", "desktop", "linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "PySide6-Essentials>=6.7,<7.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "keyring>=25.2,<26.0",
  "SecretStorage>=3.3,<4.0; sys_platform == 'linux'",
  "platformdirs>=4.2,<5.0",
  "orjson>=3.10,<4.0",
  "eth-abi>=5.2,<6.0",
  "eth-hash[pycryptodome]>=0.8,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]
packaging = [
  "pyinstaller>=6.11,<7.0",
]

[project.scripts]
oracle41-open = "oracle41_open.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle41_open"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "ASYNC"]
ignore = ["E501", "SIM102", "SIM108", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
mypy_path = "src"
